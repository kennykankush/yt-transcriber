name: Portability checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-speakers.txt
      - run: python -m unittest discover -s tests -v
      - name: Check Windows PowerShell syntax and launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'bootstrap.ps1'), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'venv failed' }
          .\bin\transcribe.cmd --help
          if ($LASTEXITCODE -ne 0) { throw 'launcher failed' }
          .\bin\transcribe.cmd
          if ($LASTEXITCODE -ne 1) { throw 'launcher did not preserve usage exit code' }
          exit 0
